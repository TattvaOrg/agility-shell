# =============================================================================
#  Dependabot Configuration
#  Keeps Python dependencies (requirements.txt) and GitHub Actions up to date
# =============================================================================

version: 2
updates:
  # Maintain Python dependencies defined in requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows if added
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
