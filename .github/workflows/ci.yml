name: CI

on:
  push:
    branches: [ main, rust-rewrite, rust-ccc ]
  pull_request:
    branches: [ main, rust-rewrite ]

jobs:
  rust-and-qml-ci:
    name: Rust & QML CI Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libwayland-dev pkg-config

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Cargo Check Workspace
        run: cargo check --workspace --all-targets

      - name: Cargo Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Run Tests & Headless Mock Harness
        run: cargo test --workspace --verbose

      - name: Optional QML Lint Verification
        run: |
          if command -v qmllint >/dev/null 2>&1; then
            qmllint quickshell/agility/shell.qml \
                    quickshell/agility/bar/*.qml \
                    quickshell/agility/dock/*.qml \
                    quickshell/agility/launcher/*.qml \
                    quickshell/agility/notifications/*.qml \
                    quickshell/agility/osd/*.qml \
                    quickshell/agility/popouts/*.qml \
                    quickshell/agility/canvas/*.qml \
                    quickshell/agility/lockscreen/*.qml
          else
            echo "qmllint not available in ubuntu runner; skipping"
          fi
