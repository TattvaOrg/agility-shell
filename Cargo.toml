[workspace]
resolver = "2"
members = [
    "crates/agility-common",
    "crates/agilityd",
    "crates/agility-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["TattvaOrg"]
license = "GPL-3.0-or-later"
repository = "https://github.com/TattvaOrg/agility-shell"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
zbus = { version = "5.0", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.33"
nucleo = "0.5"
pam-sys = "0.5"
libpulse-binding = "2.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 1


